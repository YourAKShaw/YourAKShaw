name: ✨ Feature request
description: Propose a new capability or a change to existing behavior.
title: "✨ feat: "
labels: ["type: feat"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Search existing issues first.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Who needs this, and what problem do they hit today?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The user-facing outcome, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One checkbox per observable criterion.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this change includes.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Related work that this change deliberately leaves out.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Constraints, affected modules, or design ideas.
    validations:
      required: false
  - type: textarea
    id: tasks
    attributes:
      label: Task checklist
      description: Implementation steps. Usually filled in by whoever picks it up.
    validations:
      required: false
