name: Activity cards

# Renders the README activity cards and publishes them to the `output`
# branch, so they never depend on a third-party card host. Add a
# CARDS_TOKEN secret (a read-only PAT) to include private contributions.

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - scripts/generate-cards.mjs
      - .github/workflows/cards.yml
  workflow_dispatch:

# No default access; each job asks only for what it needs.
permissions: {}

concurrency:
  group: activity-cards
  cancel-in-progress: true

jobs:
  render:
    name: Render activity cards
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the generator; it only reads the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
          CARD_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-cards.mjs "$CARD_LOGIN" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cards
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to the output branch
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-push the rendered SVGs to the output branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cards
          path: dist
      - name: Push the output branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(cards): :card_file_box: refresh activity cards"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" output
