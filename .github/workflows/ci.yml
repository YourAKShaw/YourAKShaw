name: CI

# No language toolchain was detected, so this workflow only runs
# repository-wide checks. Add your build and test steps below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Whitespace errors and conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
