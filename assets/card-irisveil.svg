<svg xmlns="http://www.w3.org/2000/svg" width="780" height="214" viewBox="0 0 780 214" role="img" aria-labelledby="t d">
<title id="t">IrisVeil</title><desc id="d">Open-source product. Research a prospect’s website, verify the facts, and turn the brief into personalized outreach—through a CLI or a lightweight web app.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.o{transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway 6s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(30deg)}}
.blink{animation:blink 1.4s steps(2,jump-none) infinite}@keyframes blink{from{opacity:1}to{opacity:0}}
.sweep{animation:sweep 11s linear infinite}@keyframes sweep{to{stroke-dashoffset:-100}}
.slide{animation:slide 5s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 2.6s ease-in-out infinite}@keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.drift{animation:drift 16s linear infinite}.drift2{animation:drift 24s linear infinite reverse}@keyframes drift{to{transform:translateX(-480px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style>
<defs><radialGradient id="r" cx="0.86" cy="0.5" r=".9"><stop stop-color="#2DD4BF" stop-opacity=".17"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="779" height="213" rx="14" fill="#0D1117" stroke="#134E4A"/><rect x=".5" y=".5" width="779" height="213" rx="14" fill="url(#r)"/><rect class="sweep" style="animation-delay:-0s" x=".5" y=".5" width="779" height="213" rx="14" fill="none" stroke="#2DD4BF" stroke-width="1.2" pathLength="100" stroke-dasharray="9 91"/>
<g transform="translate(652 107)"><circle r="70" fill="none" stroke="#2DD4BF" stroke-opacity="0.16"/><circle r="52" fill="none" stroke="#2DD4BF" stroke-opacity="0.26"/><circle r="34" fill="none" stroke="#2DD4BF" stroke-opacity="0.4"/>
<g class="o spin" style="transform-box:view-box;transform-origin:0 0"><path d="M0-52A52 52 0 0 1 45 26" fill="none" stroke="#2DD4BF" stroke-width="1.6" stroke-linecap="round"/><circle cx="0" cy="-70" r="2.6" fill="#F59E0B"/></g>
<path d="M-30 0Q0-26 30 0Q0 26-30 0Z" fill="#0D1117" stroke="#2DD4BF" stroke-width="1.6"/><circle r="9.5" class="o pulse" fill="#2DD4BF"/></g>
<g class="rise"><text class="m" x="28" y="42" font-size="11" letter-spacing="1.6" fill="#2DD4BF">01 · OPEN-SOURCE PRODUCT</text>
<text x="28" y="80" font-size="32" font-weight="600" fill="#FFFFFF">IrisVeil</text>
<text x="28" y="110" font-size="14.5" fill="#C9D1D9">Research a prospect’s website, verify the facts, and turn</text><text x="28" y="131" font-size="14.5" fill="#C9D1D9">the brief into personalized outreach—through a CLI or a</text><text x="28" y="152" font-size="14.5" fill="#C9D1D9">lightweight web app.</text><rect x="28" y="176" width="76" height="20" rx="10" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".35"/><text class="m" x="66.0" y="189.5" text-anchor="middle" font-size="10" fill="#2DD4BF">AI product</text><rect x="110" y="176" width="94" height="20" rx="10" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".35"/><text class="m" x="157.0" y="189.5" text-anchor="middle" font-size="10" fill="#2DD4BF">CLI + web app</text><rect x="210" y="176" width="82" height="20" rx="10" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".35"/><text class="m" x="251.0" y="189.5" text-anchor="middle" font-size="10" fill="#2DD4BF">Open source</text></g><path d="M746 33L755 24M748 24H755V31" fill="none" stroke="#2DD4BF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
</svg>
