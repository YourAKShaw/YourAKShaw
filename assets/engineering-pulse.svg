<svg xmlns="http://www.w3.org/2000/svg" width="960" height="44" viewBox="0 0 960 44" role="img" aria-labelledby="title desc">
  <title id="title">YourAKShaw engineering pulse</title>
  <desc id="desc">A teal signal moves between three amber nodes on a circuit line.</desc>
  <defs>
    <linearGradient id="track"><stop stop-color="#14b8a6" stop-opacity="0"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></linearGradient>
  </defs>
  <path d="M24 22H282l12-10h72l12 10h204l12 10h72l12-10h258" fill="none" stroke="url(#track)" stroke-width="1.5"/>
  <g fill="#f59e0b">
    <circle cx="282" cy="22" r="3"/>
    <circle cx="480" cy="22" r="3"/>
    <circle cx="678" cy="22" r="3"/>
  </g>
  <g fill="none" stroke="#2dd4bf" stroke-width="1.3">
    <circle cx="282" cy="22" r="6" opacity=".7">
      <animate attributeName="r" values="6;17;6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="22" r="6" opacity=".7">
      <animate attributeName="r" values="6;17;6" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="678" cy="22" r="6" opacity=".7">
      <animate attributeName="r" values="6;17;6" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0;.7" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle r="2.5" fill="#5eead4">
    <animateMotion dur="6s" repeatCount="indefinite" path="M24 22H282l12-10h72l12 10h204l12 10h72l12-10h258"/>
  </circle>
</svg>
