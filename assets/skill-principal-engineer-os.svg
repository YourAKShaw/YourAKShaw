<svg xmlns="http://www.w3.org/2000/svg" width="388" height="186" viewBox="0 0 388 186" role="img" aria-labelledby="t d">
<title id="t">Principal Engineer OS</title><desc id="d">Engineering Judgment. Bring principal-engineer judgment to architecture, code reviews, debugging, refactoring, and production readiness.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.o{transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 3.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.spin{animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway 6s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(30deg)}}
.blink{animation:blink 1.4s steps(2,jump-none) infinite}@keyframes blink{from{opacity:1}to{opacity:0}}
.sweep{animation:sweep 11s linear infinite}@keyframes sweep{to{stroke-dashoffset:-100}}
.slide{animation:slide 5s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 2.6s ease-in-out infinite}@keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.drift{animation:drift 16s linear infinite}.drift2{animation:drift 24s linear infinite reverse}@keyframes drift{to{transform:translateX(-480px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}</style>
<defs><radialGradient id="r" cx="0.85" cy="0.1" r=".9"><stop stop-color="#2DD4BF" stop-opacity=".17"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="387" height="185" rx="14" fill="#0D1117" stroke="#134E4A"/><rect x=".5" y=".5" width="387" height="185" rx="14" fill="url(#r)"/><rect class="sweep" style="animation-delay:-3.4s" x=".5" y=".5" width="387" height="185" rx="14" fill="none" stroke="#2DD4BF" stroke-width="1.2" pathLength="100" stroke-dasharray="9 91"/>
<rect x="20" y="20" width="44" height="44" rx="11" fill="#2DD4BF" fill-opacity=".09" stroke="#2DD4BF" stroke-opacity=".3"/>
<g transform="translate(42 42)"><g fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0-11 11-5 0 1-11-5Z"/><path class="pulse" d="M-11 0 0 6 11 0"/><path class="pulse" style="animation-delay:.8s" d="M-11 5 0 11 11 5"/></g></g>
<g class="rise"><text class="m" x="76" y="35" font-size="10" letter-spacing="1.4" fill="#2DD4BF">02 · ENGINEERING JUDGMENT</text>
<text x="76" y="59" font-size="19" font-weight="600" fill="#FFFFFF">Principal Engineer OS</text>
<text x="20" y="92" font-size="13" fill="#C9D1D9">Bring principal-engineer judgment to</text><text x="20" y="111" font-size="13" fill="#C9D1D9">architecture, code reviews, debugging,</text><text x="20" y="130" font-size="13" fill="#C9D1D9">refactoring, and production readiness.</text><rect x="20" y="150" width="88" height="20" rx="10" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".35"/><text class="m" x="64.0" y="163.5" text-anchor="middle" font-size="10" fill="#2DD4BF">Architecture</text><rect x="114" y="150" width="82" height="20" rx="10" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".35"/><text class="m" x="155.0" y="163.5" text-anchor="middle" font-size="10" fill="#2DD4BF">Reliability</text><rect x="202" y="150" width="76" height="20" rx="10" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".35"/><text class="m" x="240.0" y="163.5" text-anchor="middle" font-size="10" fill="#2DD4BF">Production</text></g><path d="M358 30L367 21M360 21H367V28" fill="none" stroke="#2DD4BF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
</svg>
